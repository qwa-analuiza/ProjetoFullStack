# Produção: ativado com SPRING_PROFILES_ACTIVE=prod.
# Nada aqui tem valor padrão: se faltar uma variável, a aplicação NÃO sobe (melhor do que subir insegura).
#
# Variáveis obrigatórias:
#   DB_URL        ex.: jdbc:mysql://HOST:3306/darkkitchen?useSSL=true&serverTimezone=UTC
#   DB_USUARIO    usuário do banco
#   DB_SENHA      senha do banco
#   JWT_SEGREDO   texto aleatório com 32+ caracteres (assina os tokens de login)
#   ADMIN_EMAIL   e-mail do administrador criado no primeiro start
#   ADMIN_SENHA   senha do administrador
#   CORS_ORIGENS  endereço do frontend, ex.: https://darkkitchen.vercel.app
# Opcional:
#   PORT          porta HTTP (a maioria das hospedagens define sozinha)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}

app.jwt.segredo=${JWT_SEGREDO}
app.cors.origens-permitidas=${CORS_ORIGENS}
app.admin.email=${ADMIN_EMAIL}
app.admin.senha=${ADMIN_SENHA}

# Documentação Swagger desligada em produção
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Respeita HTTPS/host repassados pelo proxy da hospedagem
server.forward-headers-strategy=framework
