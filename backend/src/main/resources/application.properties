# Configuração base (desenvolvimento). Em produção, rode com SPRING_PROFILES_ACTIVE=prod
# para usar também o application-prod.properties, que exige todas as variáveis.
server.port=${PORT:8080}
spring.application.name=dark-kitchen

# ===== MySQL =====
# Endereço em DB_URL, usuário em DB_USUARIO e senha em DB_SENHA (variáveis de ambiente).
# A senha NÃO fica neste arquivo (no IntelliJ: Run > Edit Configurations > Environment variables).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/darkkitchen?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:Ceci@@123}

# As tabelas são criadas/atualizadas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
spring.jackson.time-zone=America/Sao_Paulo
server.error.include-message=never

# ===== Segurança =====
app.jwt.segredo=${JWT_SEGREDO:dark-kitchen-segredo-de-desenvolvimento-troque-em-producao}
app.jwt.expiracao-minutos=720
# Origens do frontend que podem chamar a API, separadas por vírgula
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

# ADMIN criado no primeiro start
app.admin.nome=Administrador
app.admin.email=${ADMIN_EMAIL:admin@darkkitchen.com}
app.admin.senha=${ADMIN_SENHA:admin123}
